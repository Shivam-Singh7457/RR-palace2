version: '3.8'

services:
  # Python FastAPI AI & RAG Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: rr_palace_ai_service
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=gemini
      - LLM_MODEL=gemini-3.6-flash
      - NODE_BACKEND_URL=http://node-backend:5000
    env_file:
      - ./ai-service/.env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rr_network

  # Node.js Express MERN Backend
  node-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rr_palace_node_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
    env_file:
      - ./server/.env
    restart: always
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - rr_network

networks:
  rr_network:
    driver: bridge
